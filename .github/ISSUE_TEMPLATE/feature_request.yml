name: Feature request
description: Suggest a useful improvement or analysis
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should Prospect Signal solve?
      description: Start with the sales or marketing decision, not the proposed UI.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful outcome look like?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method or source
      description: If this relies on a register field, an API detail or a legal rule, link the official source.
  - type: textarea
    id: data
    attributes:
      label: Required input data
      description: Describe columns or data shape using invented examples only.
